module_name: Native SE3
parameters:
    - group: Native SE3
      definitions:
        SE3_ENABLE:
            description:
                short: Allow experimental onboard SE3 control
                long: |
                    Registers passively at boot. SE3 can be selected only
                    for an already airborne aircraft with valid state.
            type: int32
            min: 0
            max: 1
            default: 1
        SE3_KX:
            description:
                short: Native SE3 position gain divided by mass
            type: float
            min: 0.0
            max: 100.0
            default: 4.0
        SE3_KV:
            description:
                short: Native SE3 velocity gain divided by mass
            type: float
            min: 0.0
            max: 100.0
            default: 3.0
        SE3_KRX:
            description:
                short: Native SE3 roll attitude-to-rate gain
            type: float
            min: 0.0
            max: 100.0
            default: 5.0
        SE3_KRY:
            description:
                short: Native SE3 pitch attitude-to-rate gain
            type: float
            min: 0.0
            max: 100.0
            default: 5.0
        SE3_KRZ:
            description:
                short: Native SE3 yaw attitude-to-rate gain
            type: float
            min: 0.0
            max: 100.0
            default: 2.0
        SE3_RATE_MAX:
            description:
                short: Native SE3 maximum requested body rate
            type: float
            unit: rad/s
            min: 0.1
            max: 12.0
            default: 3.0
        SE3_CTRL:
            description:
                short: Native SE3 attitude control path
                long: |
                    ATTITUDE_PX4: geometric attitude and normalized thrust
                    (vehicle_attitude_setpoint) for the PX4 attitude
                    controller, PX4 rate controller and native allocation,
                    with their MC_* gains. The SE3 rate gains are unused.
                    RATE_PX4: SE3 body-rate and normalized-thrust setpoints for
                    the PX4 rate controller and native allocation (original
                    SE3 controller).
                    PHYSICAL: physical Lee moment and thrust in SI units at the
                    gyro rate, allocated in rotor-thrust space with the SE3_MODEL
                    model; the PX4 rate controller is disabled while SE3 is
                    selected and re-enabled on an SE3 fault. Requires
                    THR_MDL_FAC = 0 and the model's airframe and output
                    parameters.
                    Fixed until reboot. Numbering changed from the earlier
                    experimental build (0 RATE_PX4, 1 PHYSICAL): a value of 1
                    stored by that build now selects RATE_PX4. The active path
                    is printed at boot and by 'se3_control status'.
            type: enum
            values:
                0: ATTITUDE_PX4
                1: RATE_PX4
                2: PHYSICAL
            min: 0
            max: 2
            reboot_required: true
            default: 1
        SE3_MODEL:
            description:
                short: Native SE3 physical vehicle model
                long: |
                    Mass, inertia, rotor geometry and thrust curves used by
                    SE3_CTRL = PHYSICAL. Fixed until reboot.
            type: enum
            values:
                0: Gazebo F450 (4022_gz_f450)
            reboot_required: true
            default: 0
        SE3_PKRX:
            description:
                short: Native SE3 physical roll attitude gain
            type: float
            unit: Nm/rad
            min: 0.0
            max: 50.0
            decimal: 3
            default: 5.0
        SE3_PKRY:
            description:
                short: Native SE3 physical pitch attitude gain
            type: float
            unit: Nm/rad
            min: 0.0
            max: 50.0
            decimal: 3
            default: 5.0
        SE3_PKRZ:
            description:
                short: Native SE3 physical yaw attitude gain
            type: float
            unit: Nm/rad
            min: 0.0
            max: 50.0
            decimal: 3
            default: 1.1
        SE3_PKWX:
            description:
                short: Native SE3 physical roll angular-rate gain
            type: float
            unit: Nm/(rad/s)
            min: 0.0
            max: 10.0
            decimal: 3
            default: 0.53
        SE3_PKWY:
            description:
                short: Native SE3 physical pitch angular-rate gain
            type: float
            unit: Nm/(rad/s)
            min: 0.0
            max: 10.0
            decimal: 3
            default: 0.53
        SE3_PKWZ:
            description:
                short: Native SE3 physical yaw angular-rate gain
            type: float
            unit: Nm/(rad/s)
            min: 0.0
            max: 10.0
            decimal: 3
            default: 0.35
    - group: Native Trajectory
      definitions:
        TRJ_SP_X:
            description:
                short: Live setpoint X (absolute local NED)
            type: float
            unit: m
            min: -10
            max: 10
            default: 0.0
        TRJ_SP_Y:
            description:
                short: Live setpoint Y (absolute local NED)
            type: float
            unit: m
            min: -10
            max: 10
            default: 0.0
        TRJ_SP_Z:
            description:
                short: Live setpoint Z (absolute local NED)
            type: float
            unit: m
            min: -10
            max: 0
            default: -0.75
        TRJ_SP_YAW:
            description:
                short: Live setpoint yaw
            type: float
            unit: rad
            min: -6.28319
            max: 6.28319
            default: 0.0
        TRJ_STEP_HOLD:
            description:
                short: Hold at each of five hardcoded setpoints
            type: float
            unit: s
            min: 0.1
            max: 60
            default: 3.0
        TRJ_HOME_X:
            description:
                short: Circle and figure-eight center X
            type: float
            unit: m
            min: -10
            max: 10
            default: 0.0
        TRJ_HOME_Y:
            description:
                short: Circle and figure-eight center Y
            type: float
            unit: m
            min: -10
            max: 10
            default: 0.0
        TRJ_HOME_Z:
            description:
                short: Circle and figure-eight center Z
            type: float
            unit: m
            min: -10
            max: 0
            default: -0.75
        TRJ_HOME_YAW:
            description:
                short: Circle and figure-eight yaw
            type: float
            unit: rad
            min: -6.28319
            max: 6.28319
            default: 0.0
        TRJ_CIR_R:
            description:
                short: Circle radius
            type: float
            unit: m
            min: 0.05
            max: 5
            default: 0.5
        TRJ_CIR_T:
            description:
                short: Circle duration
            type: float
            unit: s
            min: 0.1
            max: 600
            default: 20.0
        TRJ_CIR_TURNS:
            description:
                short: Complete turns per circle
            type: int32
            min: 1
            max: 10
            default: 1
        TRJ_F8_AX:
            description:
                short: Figure-eight X amplitude
            type: float
            unit: m
            min: 0.01
            max: 5
            default: 0.5
        TRJ_F8_AY:
            description:
                short: Figure-eight Y amplitude
            type: float
            unit: m
            min: 0.01
            max: 5
            default: 0.5
        TRJ_F8_T:
            description:
                short: Figure-eight duration
            type: float
            unit: s
            min: 0.1
            max: 600
            default: 30.0
        TRJ_F8_TURNS:
            description:
                short: Figure-eight cycles
            type: int32
            min: 1
            max: 10
            default: 1
